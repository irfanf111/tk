<!DOCTYPE html>
<html lang="id">

<head>
     <meta charset="UTF-8" />
     <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <title>Use Case Diagram – Sistem Informasi TK Puspitasari</title>
     <style>
          @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

          * {
               margin: 0;
               padding: 0;
               box-sizing: border-box;
          }

          body {
               font-family: 'Inter', sans-serif;
               background: #0f0f1a;
               min-height: 100vh;
               display: flex;
               flex-direction: column;
               align-items: center;
               padding: 32px 16px 64px;
          }

          h1 {
               color: #fff;
               font-size: 1.5rem;
               font-weight: 700;
               text-align: center;
               margin-bottom: 6px;
               letter-spacing: -0.3px;
          }

          .subtitle {
               color: #9ca3af;
               font-size: 0.85rem;
               text-align: center;
               margin-bottom: 32px;
          }

          .diagram-wrapper {
               background: #ffffff;
               border-radius: 16px;
               padding: 48px 40px;
               box-shadow: 0 0 60px rgba(99, 102, 241, 0.15), 0 4px 30px rgba(0, 0, 0, 0.4);
               width: 100%;
               max-width: 1380px;
               overflow-x: auto;
          }

          svg {
               display: block;
               margin: 0 auto;
               font-family: 'Inter', sans-serif;
          }

          /* ── Actors ── */
          .actor-label {
               font-size: 13px;
               font-weight: 700;
               fill: #111827;
          }

          .actor-stick {
               stroke: #374151;
               stroke-width: 2;
               fill: none;
          }

          .actor-head {
               stroke: #374151;
               stroke-width: 2;
               fill: #f9fafb;
          }

          /* ── System boundary ── */
          .boundary {
               fill: #f0f4ff;
               stroke: #6366f1;
               stroke-width: 2;
               stroke-dasharray: 6 3;
               rx: 18;
          }

          .boundary-label {
               font-size: 14px;
               font-weight: 700;
               fill: #4338ca;
               letter-spacing: 0.5px;
          }

          /* ── Use-case ellipses ── */
          .uc {
               fill: white;
               stroke-width: 1.8;
          }

          .uc-admin {
               stroke: #6366f1;
          }

          .uc-user {
               stroke: #22c55e;
          }

          .uc-shared {
               stroke: #f59e0b;
          }

          .uc-auth {
               stroke: #ec4899;
          }

          .uc-text {
               font-size: 10.5px;
               font-weight: 600;
               fill: #1f2937;
               text-anchor: middle;
               dominant-baseline: middle;
               pointer-events: none;
          }

          /* ── Lines ── */
          .assoc {
               stroke: #374151;
               stroke-width: 1.5;
               fill: none;
          }

          .include {
               stroke: #6366f1;
               stroke-width: 1.4;
               fill: none;
               stroke-dasharray: 5 3;
          }

          .extend {
               stroke: #22c55e;
               stroke-width: 1.4;
               fill: none;
               stroke-dasharray: 5 3;
          }

          .arrow {
               stroke: #374151;
               fill: #374151;
          }

          .arrow-inc {
               stroke: #6366f1;
               fill: #6366f1;
          }

          .arrow-ext {
               stroke: #22c55e;
               fill: #22c55e;
          }

          .rel-label {
               font-size: 9px;
               fill: #6b7280;
          }

          /* legend */
          .legend-box {
               fill: #f9fafb;
               stroke: #e5e7eb;
               stroke-width: 1;
               rx: 8;
          }

          .legend-text {
               font-size: 11px;
               fill: #374151;
               font-weight: 500;
          }

          .legend-title {
               font-size: 12px;
               fill: #111827;
               font-weight: 700;
          }
     </style>
</head>
